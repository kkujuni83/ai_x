<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=300" />
  <title>quiz4. 메뉴</title>
  <style>
   div{width:300px; margin:0 auto; border:1px solid blue; text-align:center;}
  </style>
</head>
<body>
  <div>
    <h3>quiz4. 메뉴</h3>
    <p>
      <button>네이버</button>
      <button>다음</button>
      <button>구글</button>
      <button>유투브</button>
    </p>
  </div>

  <script>
    const url = [
      'http://www.naver.com',
      'http://www.daum.net',
      'http://www.google.com',
      'http://www.youtube.com'
    ];

    const buttons = document.querySelectorAll('button');

    buttons.forEach((button, index) => {
      button.addEventListener('click', () => {
        location.href = url[index];
      });
    });
  </script>
</body>
</html>
