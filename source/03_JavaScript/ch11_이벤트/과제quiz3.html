<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Mouse Down/Up Button</title>
  <style>
    body {
      text-align: left;
    img {
      width: 60px;
      height: 60px;
      cursor: pointer;
    }
  </style>
  <script>
    function pressButton(imgElement) {
      imgElement.src = "img/but2.gif"; // 눌린 상태 (우측처럼 보이는 버튼)
    }

    function releaseButton(imgElement) {
      imgElement.src = "img/but1.gif"; // 원래 상태로 복원
    }
  </script>
</head>
<body>
  <img 
    src="img/but1.gif" 
    alt="mouse up"
    onmousedown="pressButton(this)" 
    onmouseup="releaseButton(this)" 
  />
</body>
</html>
