<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>숫자 키 색상 변경</title>
  <style>
    table{width:500px; margin: 10px auto; background-color: darkgreen;}
    td{background-color: white; padding: 50px; text-align: center;}
  </style>
  <script>
    window.onkeyup = function(event) {
      let key = event.keyCode;
      let num = -1;

      // 숫자 키 처리: 위쪽 숫자 키보드 (48~56) 또는 넘버패드 (96~104)
      if (key >= 48 && key <= 56) {
        num = key - 48;
      } else if (key >= 96 && key <= 104) {
        num = key - 96;
      }

      // 유효한 숫자일 경우 색상 변경
      if (num >= 0 && num <= 8) {
        resetColors(); // 이전 색 초기화
        let tdList = document.getElementsByTagName("td");
        tdList[num].style.backgroundColor = "yellow";
        if (num + 1 <= 8) {
          tdList[num + 1].style.backgroundColor = "red";
        }
      }
    };

    function resetColors() {
      let tdList = document.getElementsByTagName("td");
      for (let td of tdList) {
        td.style.backgroundColor = "white";
      }
    }
  </script>
</head>
<body>
  <table>
    <tr>
      <td>0</td><td>1</td><td>2</td>
    </tr>
    <tr>
      <td>3</td><td>4</td><td>5</td>
    </tr>
    <tr>
      <td>6</td><td>7</td><td>8</td>
    </tr>
  </table>
</body>
</html>
