<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>버튼 마우스오버</title>
  <style>
    ul{overflow: hidden;}
    li{float: left; list-style: none; margin: 3px;}
  </style>
  <script>
    const overImg = ['img/0over.jpg', 'img/1over.jpg', 'img/2over.jpg', 'img/3over.jpg'];
    const outImg  = ['img/0out.jpg',  'img/1out.jpg',  'img/2out.jpg',  'img/3out.jpg'];

    function changeImg(index, state) {
      const imgTag = document.getElementById('btn' + index);
      imgTag.src = (state === 'over') ? overImg[index] : outImg[index];
    }
  </script>
</head>
<body>
  <ul>
    <li>
      <a href="https://example.com/tutorial">
        <img id="btn0" src="img/0out.jpg" 
             onmouseover="changeImg(0, 'over')" 
             onmouseout="changeImg(0, 'out')" />
      </a>
    </li>
    <li>
      <a href="https://example.com/example">
        <img id="btn1" src="img/1out.jpg" 
             onmouseover="changeImg(1, 'over')" 
             onmouseout="changeImg(1, 'out')" />
      </a>
    </li>
    <li>
      <a href="https://example.com/special">
        <img id="btn2" src="img/2out.jpg" 
             onmouseover="changeImg(2, 'over')" 
             onmouseout="changeImg(2, 'out')" />
      </a>
    </li>
    <li>
      <a href="https://example.com/link">
        <img id="btn3" src="img/3out.jpg" 
             onmouseover="changeImg(3, 'over')" 
             onmouseout="changeImg(3, 'out')" />
      </a>
    </li>
  </ul>
</body>
</html>
